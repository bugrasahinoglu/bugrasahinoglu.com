# Builds the site exactly like Cloudflare Pages does and checks internal links
# (pages, images, #fragments). Cloudflare deploys independently of this job:
# a red run is a notification, not a gate.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with HUGO_VERSION in Cloudflare Pages and the local Hugo.
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Hugo (official release, checksum verified)
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo && tar -xzf "$tarball" -C hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build (same command as Cloudflare Pages)
        run: |
          hugo version
          hugo --gc --minify

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Absolute links to the site are remapped onto the build output, so
          # only local files are checked (--offline) and nothing leaves the runner.
          args: >-
            --no-progress
            --offline
            --root-dir ${{ github.workspace }}/public
            --remap '^https://bugrasahinoglu\.com/(.*)$ file://${{ github.workspace }}/public/$1'
            --index-files index.html
            --include-fragments
            'public/**/*.html'
          jobSummary: true
