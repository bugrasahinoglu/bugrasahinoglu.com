baseURL: "https://bugrasahinoglu.com/"
languageCode: "en-us"
title: "Mehmet Buğra Şahinoğlu"
theme: "PaperMod"
description: "Notes on incident response, threat hunting, and detection engineering."

params:
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
  images: ["/og-image.png"]
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  profileMode:
    enabled: true
    title: "Mehmet Buğra Şahinoğlu"
    subtitle: "Cybersecurity"
    buttons:
      - name: Posts
        url: posts
  socialIcons:
    - name: github
      url: "https://github.com/bugrasahinoglu"
    - name: linkedin
      url: "https://linkedin.com/in/mehmetbugrasahinoglu"
    - name: email
      url: "mailto:contact@bugrasahinoglu.com"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 15
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 25

markup:
  highlight:
    style: github-dark
    lineNos: false
    noClasses: false
    guessSyntax: true
    tabWidth: 2
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4