baseURL: "https://bugrasahinoglu.com/"
locale: "en-us"
title: "Mehmet Buğra Şahinoğlu"
theme: "PaperMod"
enableRobotsTXT: true
# Keep taxonomy terms exactly as written (e.g. "macOS", not "MacOS").
titleCaseStyle: none

params:
  description: "Notes on incident response, threat hunting, and detection engineering."
  author: "Mehmet Buğra Şahinoğlu"
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
    theme_color: "#16181d"
  images: ["/og-image.png"]
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowFullTextinRSS: true
  ShowRssButtonInSectionTermList: true
  editPost:
    URL: "https://github.com/bugrasahinoglu/bugrasahinoglu.com/edit/main/content"
    Text: "Suggest a correction"
    appendFilePath: true
  profileMode:
    enabled: true
    title: "Mehmet Buğra Şahinoğlu"
    subtitle: "Senior Cybersecurity Analyst · Incident Response · Threat Hunting"
    buttons:
      - name: Posts
        url: posts
      - name: CV
        url: cv
  socialIcons:
    - name: github
      url: "https://github.com/bugrasahinoglu"
    - name: linkedin
      url: "https://linkedin.com/in/mehmetbugrasahinoglu"
    - name: email
      url: "mailto:mehmet@bugrasahinoglu.com"
    - name: rss
      url: "/index.xml"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: cv
      name: CV
      url: /cv/
      weight: 22

markup:
  highlight:
    style: github-dark
    lineNos: false
    noClasses: false
    guessSyntax: true
    tabWidth: 2
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
